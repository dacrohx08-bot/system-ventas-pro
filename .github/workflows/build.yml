name: Crear instaladores
# Se ejecuta solo cuando subes una "etiqueta" de versión, por ejemplo v12.77.0
# (Mac está desactivado: GitHub casi nunca tiene equipos Mac libres y hacía fallar todo.)
on:
  push:
    tags: ['v*']
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
