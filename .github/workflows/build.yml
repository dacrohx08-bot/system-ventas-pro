name: Crear instaladores
# Se ejecuta solo cuando subes una "etiqueta" de versión, por ejemplo v12.81.3
# Crea: instalador de Windows, de Linux y la app de Android (.apk).
on:
  push:
    tags: ['v*']
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  android:
    # Espera a que Windows/Linux terminen para que el release ya exista
    needs: build
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Firma fija (opcional, para que las actualizaciones se instalen encima)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Se usará la firma fija."
          else
            echo "Sin firma fija: la app se firmará con una llave nueva (para actualizar habrá que desinstalar la anterior)."
          fi

      - name: Preparar el proyecto de Android
        shell: bash
        run: |
          set -e
          mkdir mobile && cd mobile
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/device@6
          mkdir www
          cp ../app/index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.systemventaspro.app",
            "appName": "System Ventas Pro",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Versión e iconos
        shell: bash
        run: |
          set -e
          if ! command -v convert > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          command -v convert
          cd mobile
          VER=$(node -p "require('../package.json').version")
          IFS=. read MA MI PA <<< "$VER"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "Versión $VER (código $CODE)"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          RES=android/app/src/main/res
          # los iconos van incluidos aquí mismo (no dependen de ningún otro archivo)
          mkdir -p icons
          echo '' | base64 -d > icons/android-icon.png
          echo '' | base64 -d > icons/android-fg.png
          if [ -f icons/android-icon.png ] && [ -f icons/android-fg.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read DEN S F <<< "$d"
              mkdir -p $RES/mipmap-$DEN
              convert icons/android-icon.png -resize ${S}x${S} $RES/mipmap-$DEN/ic_launcher.png
              convert icons/android-icon.png -resize ${S}x${S} $RES/mipmap-$DEN/ic_launcher_round.png
              convert icons/android-fg.png -resize ${F}x${F} $RES/mipmap-$DEN/ic_launcher_foreground.png
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B1220</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
            # los celulares modernos usan el icono "adaptable": se reescribe para que use nuestro dibujo
            rm -f $RES/drawable/ic_launcher_background.xml $RES/drawable-v24/ic_launcher_foreground.xml
            mkdir -p $RES/mipmap-anydpi-v26
            for n in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
            done
            ls $RES
            echo "Iconos aplicados."
          else
            echo "No hay iconos en build/, se usa el icono por defecto."
          fi

      - name: Construir el APK
        run: |
          set -e
          cd mobile/android
          chmod +x gradlew
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1) || true
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../SystemVentasPro-Android.apk
          ls -la ../../SystemVentasPro-Android.apk

      - name: Guardar también como archivo de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: SystemVentasPro-Android
          path: SystemVentasPro-Android.apk

      - name: Subir el APK al release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SystemVentasPro-Android.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  consulta:
    # Espera a que Windows/Linux terminen para que el release ya exista
    needs: build
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Firma fija (opcional, para que las actualizaciones se instalen encima)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Se usará la firma fija."
          else
            echo "Sin firma fija: la app se firmará con una llave nueva (para actualizar habrá que desinstalar la anterior)."
          fi

      - name: Preparar el proyecto de Android
        shell: bash
        run: |
          set -e
          mkdir mobile && cd mobile
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070b16;color:#e8ecff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}</style></head><body><div><h2>Consulta de inventario</h2><p>Necesitas internet para ver tu información.</p></div></body></html>
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.systemventaspro.consulta",
            "appName": "SVP Consulta",
            "webDir": "www",
            "server": { "url": "https://licencias-svp.systemventaspro.workers.dev/panel", "androidScheme": "https", "allowNavigation": ["licencias-svp.systemventaspro.workers.dev"] },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Versión e iconos
        shell: bash
        run: |
          set -e
          if ! command -v convert > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          command -v convert
          cd mobile
          VER=$(node -p "require('../package.json').version")
          IFS=. read MA MI PA <<< "$VER"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "Versión $VER (código $CODE)"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          RES=android/app/src/main/res
          # los iconos van incluidos aquí mismo (no dependen de ningún otro archivo)
          mkdir -p icons
          echo '' | base64 -d > icons/android-icon.png
          echo '' | base64 -d > icons/android-fg.png
          if [ -f icons/android-icon.png ] && [ -f icons/android-fg.png ]; then
            convert icons/android-icon.png -modulate 100,100,160 icons/android-icon.png
            convert icons/android-fg.png -modulate 100,100,160 icons/android-fg.png
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read DEN S F <<< "$d"
              mkdir -p $RES/mipmap-$DEN
              convert icons/android-icon.png -resize ${S}x${S} $RES/mipmap-$DEN/ic_launcher.png
              convert icons/android-icon.png -resize ${S}x${S} $RES/mipmap-$DEN/ic_launcher_round.png
              convert icons/android-fg.png -resize ${F}x${F} $RES/mipmap-$DEN/ic_launcher_foreground.png
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B1220</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
            # los celulares modernos usan el icono "adaptable": se reescribe para que use nuestro dibujo
            rm -f $RES/drawable/ic_launcher_background.xml $RES/drawable-v24/ic_launcher_foreground.xml
            mkdir -p $RES/mipmap-anydpi-v26
            for n in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
            done
            ls $RES
            echo "Iconos aplicados."
          else
            echo "No hay iconos en build/, se usa el icono por defecto."
          fi

      - name: Construir el APK
        run: |
          set -e
          cd mobile/android
          chmod +x gradlew
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1) || true
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../SystemVentasPro-Consulta.apk
          ls -la ../../SystemVentasPro-Consulta.apk

      - name: Guardar también como archivo de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: SystemVentasPro-Consulta
          path: SystemVentasPro-Consulta.apk

      - name: Subir el APK al release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SystemVentasPro-Consulta.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
